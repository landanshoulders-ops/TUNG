<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - My Drive</title>
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #e50914; margin: 10px 0 5px 0; font-size: 2.2rem; }
        .sub { color: #8c8c8c; margin-bottom: 20px; font-size: 13px; }
        .nav-link { color: #00bcd4; font-weight: bold; text-decoration: none; margin-bottom: 15px; font-size: 15px; }
        .nav-link:hover { text-decoration: underline; }

        .type-selector { margin-bottom: 15px; }
        .type-btn {
            background-color: #16161d;
            border: 2px solid #2a2a35;
            color: white;
            padding: 8px 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 20px;
            margin: 0 5px;
            transition: 0.2s;
        }
        .type-btn.active { background-color: #e50914; border-color: #e50914; }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }
        input, select, button {
            padding: 12px 16px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #2a2a35;
            background-color: #16161d;
            color: white;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: #e50914; }
        input { width: 220px; }
        .tv-meta { width: 70px; }
        select { cursor: pointer; }
        
        button { background-color: #e50914; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #f40b17; transform: translateY(-1px); }
        
        .hidden { display: none !important; }

        .search-container { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .search-bar {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 30px;
            border: 2px solid #2a2a35;
            background-color: #16161d;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        .search-bar:focus { border-color: #e50914; }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            max-height: 250px;
            overflow-y: auto;
            padding: 15px;
            background: #121218;
            border-radius: 10px;
            border: 1px solid #1f1f27;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .movie-grid::-webkit-scrollbar { width: 8px; }
        .movie-grid::-webkit-scrollbar-track { background: #121218; }
        .movie-grid::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 4px; }
        .movie-grid::-webkit-scrollbar-thumb:hover { background: #e50914; }

        .movie-card {
            background-color: #1c1c24;
            border: 1px solid #2d2d3d;
            padding: 15px 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #e0e0e6;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card:hover { border-color: #e50914; background-color: #242433; transform: scale(1.03); color: white; }
        .movie-card.active { background-color: #e50914; border-color: #e50914; color: white; }

        .player-container {
            width: 100%;
            max-width: 1100px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #1f1f27;
        }
        iframe { width: 100%; height: 550px; border: none; display: block; }
    </style>
</head>
<body>

    <h1>Cinema Streaming Server</h1>
    <div class="sub">Dynamic structural layout querying external public mirror libraries instantly.</div>
    <a href="games.html" class="nav-link">🎮 Switch to Arcade Terminal</a>

    <div class="type-selector">
        <button class="type-btn active" id="movieModeBtn" onclick="setMode('movie')">Movie Mode</button>
        <button class="type-btn" id="tvModeBtn" onclick="setMode('tv')">TV Show Mode</button>
    </div>

    <!-- Manual Entry Control Node Overrides -->
    <div class="controls">
        <input type="text" id="mediaId" placeholder="IMDb/TMDB ID" value="tt0111161">
        <input type="number" id="seasonNum" class="tv-meta hidden" placeholder="Ssn" value="1" min="1">
        <input type="number" id="episodeNum" class="tv-meta hidden" placeholder="Ep" value="1" min="1">
        
        <select id="serverSelect" onchange="checkAndRefresh()">
            <option value="https://vidsrc.to">Server 1 (VidSrc To)</option>
            <option value="https://vidlink.pro">Server 2 (VidLink Pro)</option>
            <option value="https://vidsrc.me">Server 3 (VidSrc Me)</option>
            <option value="https://embed.su">Server 4 (Embed Su)</option>
        </select>
        <button onclick="streamContent()">Launch Stream</button>
    </div>

    <!-- Live Title Filter Box -->
    <div class="search-container">
        <input type="text" id="movieSearch" class="search-bar" placeholder="Search built-in titles list..." onkeyup="filterMovies()">
    </div>

    <!-- Fast Click Library Grid Layout -->
    <div class="movie-grid" id="movieGrid"></div>

    <!-- Embedded Sandbox Viewport Frame -->
    <div class="player-container">
        <iframe id="hubPlayer" src="about:blank" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        let currentMode = 'movie';

        // MASTER MEDIA DATABASE ARRAY
        // Simply populate this object list block to seamlessly grow your library index
        const movieDatabase = [
            { name: "The Shawshank Redemption", id: "tt0111161", type: "movie" },
            { name: "Inception", id: "27205", type: "movie" },
            { name: "The Dark Knight", id: "tt0468569", type: "movie" },
            { name: "Interstellar", id: "157336", type: "movie" },
            { name: "Avatar: The Way of Water", id: "76600", type: "movie" },
            { name: "Game of Thrones", id: "tt0944947", type: "tv" },
            { name: "Stranger Things", id: "tt4574334", type: "tv" },
            { name: "Breaking Bad", id: "tt0903747", type: "tv" },
            { name: "The Mandalorian", id: "tt8111088", type: "tv" }
        ];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('movieModeBtn').classList.toggle('active', mode === 'movie');
            document.getElementById('tvModeBtn').classList.toggle('active', mode === 'tv');
            document.getElementById('seasonNum').classList.toggle('hidden', mode === 'movie');
            document.getElementById('episodeNum').classList.toggle('hidden', mode === 'movie');
            buildMovieGrid();
        }

        function buildMovieGrid() {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            // Filter elements matching the current viewing type mode (Movie vs TV)
            const filtered = movieDatabase.filter(item => item.type === currentMode);
            filtered.sort((a, b) => a.name.localeCompare(b.name));

            filtered.forEach(item => {
                const element = document.createElement('div');
                element.className = 'movie-card';
                element.textContent = item.name;
                element.setAttribute('onclick', `selectMedia('${item.id}', this)`);
                grid.appendChild(element);
            });
        }

        function filterMovies() {
            const query = document.getElementById('movieSearch').value.toLowerCase();
            const cards = document.getElementsByClassName('movie-card');
            for (let i = 0; i < cards.length; i++) {
                cards[i].style.display = cards[i].textContent.toLowerCase().includes(query) ? "block" : "none";
            }
        }

        function selectMedia(id, element) {
            document.getElementById('mediaId').value = id;
            const activeCards = document.querySelectorAll('.movie-card');
            activeCards.forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            streamContent();
        }

        function streamContent() {
            const id = document.getElementById('mediaId').value.trim();
            const serverBase = document.getElementById('serverSelect').value;
            const iframe = document.getElementById('hubPlayer');
            if (id === "") return;

            let finalUrl = "";
            if (currentMode === 'movie') {
                finalUrl = serverBase + "movie/" + id;
            } else {
                const season = document.getElementById('seasonNum').value || "1";
                const episode = document.getElementById('episodeNum').value || "1";
