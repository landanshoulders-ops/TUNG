<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Server</title>
    <style>
        :root { --primary: #e50914; --bg-dark: #08080a; --card-bg: #14141d; --border: #232330; --text: #ffffff; --text-sub: #7a7a8c; }
        body { background-color: var(--bg-dark); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed; }
        .header-bar { width: 100%; max-width: 1200px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 1px solid var(--border); }
        .brand-title { font-size: 1.8rem; font-weight: 800; margin: 0; color: var(--text); }
        .brand-title span { color: var(--primary); }
        .nav-back { color: #00bcd4; font-weight: bold; text-decoration: none; font-size: 14px; }
        .main-content { width: 100%; max-width: 1200px; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 1fr; gap: 25px; }
        .player-wrapper { background-color: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); aspect-ratio: 16 / 9; width: 100%; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .control-panel { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
        .control-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input, select, button { padding: 12px 16px; font-size: 14px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg-dark); color: var(--text); outline: none; font-weight: 600; }
        input { width: 160px; } .tv-meta { width: 65px; text-align: center; }
        button.action-play { background-color: var(--primary); border: none; cursor: pointer; color: white; }
        .mode-toggle { display: flex; background: var(--bg-dark); border-radius: 6px; padding: 3px; border: 1px solid var(--border); }
        .mode-btn { background: none; border: none; padding: 8px 16px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; color: var(--text-sub); }
        .mode-btn.active { background: var(--primary); color: white; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-height: 200px; overflow-y: auto; padding: 10px; background-color: #0b0b10; border: 1px solid var(--border); border-radius: 8px; }
        .media-card { background-color: var(--card-bg); border: 1px solid var(--border); padding: 20px 15px; border-radius: 8px; cursor: pointer; text-align: center; }
        .media-card.active { border-color: var(--primary); color: var(--primary); }
        .hidden { display: none !important; }
        .cloak-box { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; width: 100%; max-width: 1160px; display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: -10px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2 class="brand-title">Cinema<span>Stream</span></h2>
        <a href="index.html" class="nav-back">← Back to Dashboard</a>
    </div>

    <!-- CLOAK SYSTEM COMPONENT -->
    <div class="cloak-box">
        <label for="cloakSelect" style="color: #8c8c8c; font-size: 14px;">Tab Disguise Mask:</label>
        <select id="cloakSelect" onchange="applyTabCloak()" style="width: auto;">
            <option value="default">None (Normal Tab)</option>
            <option value="google">Google Search</option>
            <option value="drive">Google Drive</option>
            <option value="classroom">Google Classroom</option>
            <option value="clever">Clever Portal</option>
            <option value="mcgraw">McGraw Hill</option>
            <option value="flocab">Flocabulary</option>
            <option value="wiki">Wikipedia</option>
        </select>
    </div>

    <div class="main-content">
        <div class="player-wrapper"><iframe id="mediaPlayer" src="about:blank" allowfullscreen></iframe></div>
        <div class="control-panel">
            <div class="control-group">
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btnMovie" onclick="switchMode('movie')">Movies</button>
                    <button class="mode-btn" id="btnTv" onclick="switchMode('tv')">TV Series</button>
                </div>
                <input type="text" id="targetId" value="tt0111161">
                <input type="number" id="numSeason" class="tv-meta hidden" placeholder="Ssn" value="1">
                <input type="number" id="numEpisode" class="tv-meta hidden" placeholder="Ep" value="1">
            </div>
            <button class="action-play" onclick="executeStream()">Launch Stream 🎬</button>
        </div>
        <div class="media-grid" id="catalogGrid"></div>
    </div>

    <script>
        let currentInterfaceMode = 'movie';
        const mediaLibraryIndex = [
            { title: "The Shawshank Redemption", target: "tt0111161", category: "movie" },
            { title: "Inception", target: "27205", category: "movie" },
            { title: "The Dark Knight", target: "tt0468569", category: "movie" },
            { title: "Interstellar", target: "157336", category: "movie" },
            { title: "Game of Thrones", target: "tt0944947", category: "tv" },
            { title: "Stranger Things", target: "tt4574334", category: "tv" }
        ];

        function switchMode(mode) {
            currentInterfaceMode = mode;
            document.getElementById('btnMovie').classList.toggle('active', mode === 'movie');
            document.getElementById('btnTv').classList.toggle('active', mode === 'tv');
            document.getElementById('numSeason').classList.toggle('hidden', mode === 'movie');
            document.getElementById('numEpisode').classList.toggle('hidden', mode === 'movie');
            renderCatalogGrid();
        }

        function renderCatalogGrid() {
            const container = document.getElementById('catalogGrid'); container.innerHTML = '';
            const filteredData = mediaLibraryIndex.filter(item => item.category === currentInterfaceMode);
            filteredData.forEach(item => {
                const card = document.createElement('div'); card.className = 'media-card'; card.textContent = item.title;
                card.setAttribute('onclick', `selectMediaElement('${item.target}', this)`);
                container.appendChild(card);
            });
        }

        function selectMediaElement(id, cardElement) {
            document.getElementById('targetId').value = id;
            document.querySelectorAll('.media-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active'); executeStream();
        }

        function executeStream() {
            const id = document.getElementById('targetId').value.trim();
            const iframe = document.getElementById('mediaPlayer'); if (id === "") return;
            iframe.src = currentInterfaceMode === 'movie' ? "https://vidsrc.to" + id : "https://vidsrc.to" + id + "/" + document.getElementById('numSeason').value + "/" + document.getElementById('numEpisode').value;
        }

        function applyTabCloak() {
            const choice = document.getElementById('cloakSelect').value;
            const presets = {
                default: { title: "Cinema Server", icon: "" },
                google: { title: "Google", icon: "https://google.com" },
                drive: { title: "Google Drive - My Drive", icon: "https://gstatic.com" },
                classroom: { title: "Classes", icon: "https://gstatic.com" },
                clever: { title: "Clever | Portal", icon: "https://clever.com" },
                mcgraw: { title: "McGraw Hill Log In", icon: "https://mheducation.com" },
                flocab: { title: "Flocabulary - Educational Hip-Hop", icon: "https://flocabulary.com" },
                wiki: { title: "Wikipedia, the free encyclopedia", icon: "https://wikipedia.org" }
            };
            const target = presets[choice] || presets['default'];
            document.title = target.title; localStorage.setItem('savedCloakValue', choice);
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon'; link.rel = 'shortcut icon'; link.href = target.icon; document.head.appendChild(link);
        }

        window.onload = function() {
            if (localStorage.getItem('hubWallpaper')) document.body.style.backgroundImage = `url('${localStorage.getItem('hubWallpaper')}')`;
            if (localStorage.getItem('savedCloakValue')) { document.getElementById('cloakSelect').value = localStorage.getItem('savedCloakValue'); applyTabCloak(); }
            renderCatalogGrid();
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { window.location.replace(localStorage.getItem('hubPanicUrl') || 'https://google.com'); }
        });
    </script>
</body>
