<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>

            --bg-black: #141414;

            --card-hover: #181818;
            --border-gray: #333333;
            --text-white: #FFFFFF;
            --text-gray: #AAAAAA;
        }
        
        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        /* Premium Top Bar Navigation */
        .navigation-header { 
            width: 100%; 
            padding: 20px 4%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-sizing: border-box; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            position: absolute;
            top: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 15px;
        }
        .brand-logo { font-size: 1.8rem; font-weight: 900; margin: 0; color: var(--netflix-red); letter-spacing: -1px; }
        .brand-logo span { color: var(--text-white); font-weight: 400; font-size: 1.2rem; margin-left: 5px; }
        
        /* Sleek Live Search Input Engine Box */
        .search-wrapper { position: relative; }
        .search-input-field {
            padding: 10px 20px;
            width: 250px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input-field:focus { width: 320px; border-color: var(--netflix-red); background-color: rgba(0,0,0,0.85); box-shadow: 0 0 10px rgba(229, 9, 20, 0.3); }
        .nav-back-btn { color: var(--text-white); font-weight: bold; text-decoration: none; font-size: 14px; background-color: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 4px; border: 1px solid #444; transition: 0.2s ease; }
        .nav-back-btn:hover { background-color: var(--text-white); color: #000; border-color: var(--text-white); }

        .catalog-showcase { 
            width: 100%; 
            padding: 140px 4% 60px 4%;
            box-sizing: border-box;
            display: flex; 
            flex-direction: column; 
            gap: 40px; 
        }
        .showcase-row { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .row-main-title { font-size: 1.4rem; font-weight: 700; margin: 0; color: var(--text-white); }
        
        .scroller-viewport { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; width: 100%; box-sizing: border-box; }
        .scroller-viewport::-webkit-scrollbar { display: none; }

        /* Rank Chart Layout Specs */
        .rank-scroller-layout { padding-left: 45px !important; gap: 45px !important; }
        .rank-card-frame { position: relative; min-width: 160px; max-width: 160px; aspect-ratio: 2 / 3; border-radius: 4px; cursor: pointer; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .rank-card-frame::before { content: attr(data-rank); position: absolute; left: -40px; bottom: -15px; font-size: 9rem; font-weight: 900; line-height: 1; color: #141414; text-shadow: -2px -2px 0 #555, 2px -2px 0 #555, -2px 2px 0 #555, 2px 2px 0 #555; z-index: 1; transition: all 0.3s ease; }
        .rank-card-frame:hover::before { text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff; }
        .rank-card-frame:hover { transform: scale(1.08); z-index: 5; }
        .rank-img-layer { width: 100%; height: 100%; background-size: cover; background-position: center; border-radius: 4px; position: relative; z-index: 2; border: 1px solid rgba(255,255,255,0.05); }

        /* Standard Movie Posters Cards */
        .poster-card-frame { position: relative; min-width: 180px; max-width: 180px; aspect-ratio: 2 / 3; border-radius: 4px; cursor: pointer; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .poster-image-render { width: 100%; height: 100%; background-size: cover; background-position: center; }
        .poster-card-frame:hover { transform: scale(1.08); box-shadow: 0 12px 30px rgba(0,0,0,0.8); z-index: 5; }
        
        .card-title-shield { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 60%, rgba(0,0,0,0) 100%); padding: 25px 12px 12px 12px; box-sizing: border-box; opacity: 0; transition: opacity 0.3s ease; }
        .poster-card-frame:hover .card-title-shield { opacity: 1; }
        .shield-text-title { font-size: 13px; font-weight: 700; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shield-text-year { font-size: 11px; color: var(--netflix-red); font-weight: bold; margin-top: 2px; display: block; }

        .theater-viewport-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 99999; display: none; flex-direction: column; }
        .theater-viewport-modal iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }
        .theater-console-strip { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.95) 45%); padding: 40px 4% 30px 4%; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 100000; pointer-events: none; }

        .active-media-title { font-size: 1.6rem; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin: 0; }
        .active-media-details { font-size: 13px; color: var(--text-gray); margin-top: 5px; display: block; }
        .action-button-group { display: flex; gap: 12px; align-items: center; }
        .selector-menu, .exit-stream-btn { padding: 12px 24px; font-size: 14px; border-radius: 4px; border: 1px solid #444; background-color: rgba(24, 24, 24, 0.85); backdrop-filter: blur(15px); color: white; outline: none; font-weight: 700; cursor: pointer; transition: 0.2s ease; }
        .selector-menu:hover, .exit-stream-btn:hover { border-color: #fff; background-color: #222; }
        .exit-stream-btn { background-color: var(--netflix-red); border: none; }
        .exit-stream-btn:hover { background-color: #ff121d; }
    </style>
</head>
